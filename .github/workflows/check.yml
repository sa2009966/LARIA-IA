# Status check `check` exigido por la protección de develop/main (CICD.md §4).
# Alineado al stack real: pip + pytest + gate de cobertura de backend/pytest.ini.
name: check
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, feature/backend]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: development
      DB_PROVIDER: memory
      RATE_LIMIT_BACKEND: memory
      CACHE_BACKEND: memory
      # ≥32 chars: Settings.validate() lo exige (conftest también lo pisa).
      SECRET_KEY: ci-not-a-real-secret-32chars-min
      OPENAI_API_KEY: sk-ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.13 = Dockerfile + backend/README (CICD.md citaba 3.12, desactualizado).
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q

