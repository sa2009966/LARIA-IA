[pytest]
asyncio_mode = auto
timeout = 30
testpaths = tests
# Cobertura QA Fase 5: piso líneas 97.36%, ramas 86.99% (documentado).
# --cov-fail-under=90 aplica a cobertura combinada de líneas; ramas objetivo ≥85%.
addopts =
    --cov=src
    --cov-branch
    --cov-fail-under=90
    --cov-report=term-missing:skip-covered
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated

[coverage:run]
branch = true
source = src

[coverage:report]
# Objetivo de ramas documentado (no falla CI por debajo de líneas):
# fail_under ramas manual ≥ 85% — piso medido 86.99%
show_missing = true
skip_covered = true
